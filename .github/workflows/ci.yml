name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @jokger/web format:check
      - run: pnpm typecheck
      - run: pnpm api:typecheck
      - run: pnpm test
      - run: pnpm exec supabase start
      - run: pnpm exec supabase db reset
      - run: pnpm exec supabase test db
      - name: Configure local Supabase credentials for E2E
        run: |
          while IFS='=' read -r key value; do
            value="${value#\"}"
            value="${value%\"}"
            case "$key" in
              API_URL)
                echo "SUPABASE_URL=$value" >> "$GITHUB_ENV"
                echo "VITE_SUPABASE_URL=$value" >> "$GITHUB_ENV"
                ;;
              SERVICE_ROLE_KEY)
                echo "SUPABASE_SERVICE_ROLE_KEY=$value" >> "$GITHUB_ENV"
                ;;
              ANON_KEY)
                echo "VITE_SUPABASE_ANON_KEY=$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < <(pnpm exec supabase status -o env)
      - run: pnpm db:types
      - run: git diff --exit-code -- apps/web/src/shared/types/database.ts
      - run: pnpm build
      - name: Check client bundle for service-role credentials
        run: |
          if grep -R -n -E 'SUPABASE_SERVICE_ROLE_KEY|service_role' apps/web/dist; then
            echo "Service-role credential material found in the client bundle."
            exit 1
          fi
      - run: pnpm --filter @jokger/web exec playwright install --with-deps
      - run: pnpm --filter @jokger/web test:e2e
      - name: Run Lighthouse CI against the production preview
        run: |
          export CHROME_PATH="$(pnpm --filter @jokger/web exec node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          pnpm exec lhci autorun
      - run: pnpm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
